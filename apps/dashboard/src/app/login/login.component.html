<h2>Login</h2>

<form (ngSubmit)="onSubmit()" class="login-form">
  <label>
    Email:
    <input [(ngModel)]="email" name="email" placeholder="Email" required />
  </label>

  <label>
    Password:
    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Password"
      required
    />
  </label>

  <button type="submit">Login</button>
</form>
